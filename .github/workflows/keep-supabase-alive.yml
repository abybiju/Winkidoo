name: Keep Supabase alive

on:
  schedule:
    # Daily at 12:00 UTC. Supabase free tier pauses after 7 days of inactivity;
    # a daily ping leaves a wide margin for missed/delayed GitHub schedules.
    - cron: '0 12 * * *'
  workflow_dispatch:
    inputs:
      force_heartbeat:
        description: 'Push a heartbeat commit even if the repo is recently active (for testing the push path)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Send keepalive query
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -uo pipefail

          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::error::SUPABASE_URL and SUPABASE_SERVICE_ROLE_KEY must be set as repository secrets."
            exit 1
          fi

          echo "=== Keepalive ping at $(date -u) ==="

          # A real row read against a real table. This goes PostgREST -> Postgres,
          # which is what actually counts as project activity. select=* avoids
          # breaking if columns are renamed by a future migration.
          # Retried: transient DNS failures on the runner have failed this job before.
          ok=0
          for attempt in 1 2 3 4 5; do
            http_code=$(
              curl -sS --max-time 30 -o /tmp/ka-response -w "%{http_code}" \
                "${SUPABASE_URL}/rest/v1/profiles?select=*&limit=1" \
                -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
                -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
              || echo "000"
            )
            echo "Attempt ${attempt}: DB read returned HTTP ${http_code}"
            if [ "$http_code" -ge 200 ] && [ "$http_code" -lt 300 ]; then
              ok=1
              break
            fi
            echo "Response body: $(head -c 500 /tmp/ka-response 2>/dev/null)"
            sleep $((attempt * 15))
          done

          # Auth is a separate service from the database — ping it too so both
          # halves of the project register activity.
          auth_code=$(
            curl -sS --max-time 30 -o /dev/null -w "%{http_code}" \
              "${SUPABASE_URL}/auth/v1/settings" \
              -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            || echo "000"
          )
          echo "Auth settings returned HTTP ${auth_code}"

          if [ "$ok" -ne 1 ]; then
            echo "::error::Keepalive DB read failed after 5 attempts — project may be paused."
            exit 1
          fi
          echo "✅ Keepalive successful — Supabase project is active."

      - name: Refresh repo activity
        # GitHub disables scheduled workflows after 60 days without repository
        # activity, which would silently switch off this keepalive and let
        # Supabase pause a week later. Commit a heartbeat when the last commit
        # is getting old, so the workflow keeps itself enabled.
        env:
          FORCE_HEARTBEAT: ${{ inputs.force_heartbeat }}
        run: |
          set -euo pipefail

          last_commit_epoch=$(git log -1 --format=%ct)
          age_days=$(( ( $(date -u +%s) - last_commit_epoch ) / 86400 ))
          echo "Last commit is ${age_days} day(s) old."

          if [ "$age_days" -lt 45 ] && [ "${FORCE_HEARTBEAT}" != "true" ]; then
            echo "Repo is active — no heartbeat needed."
            exit 0
          fi

          echo "Last keepalive heartbeat: $(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            > .github/keepalive-heartbeat.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/keepalive-heartbeat.txt
          git commit -m "chore: keepalive heartbeat (keeps scheduled workflows enabled)"
          git push
          echo "✅ Heartbeat pushed — scheduled workflows stay enabled."
