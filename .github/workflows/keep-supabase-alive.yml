name: Keep Supabase alive

on:
  schedule:
    # Run every 3 days (Mon, Thu, Sun) at 12:00 UTC
    # This gives a ~3-day interval, well within the 7-day pause window
    - cron: '0 12 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Send keepalive query
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail

          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::error::SUPABASE_URL and SUPABASE_SERVICE_ROLE_KEY must be set as repository secrets."
            exit 1
          fi

          echo "=== Keepalive ping at $(date -u) ==="

          # 1. Primary: lightweight SELECT query via PostgREST (reads from any table)
          #    Using a HEAD request to the root tables endpoint counts as DB activity
          http_code=$(
            curl -sS -o /tmp/ka-response -w "%{http_code}" \
              "${SUPABASE_URL}/rest/v1/" \
              -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
              -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}"
          )
          echo "PostgREST root response: $http_code"

          # 2. Backup: run a real SQL query via the RPC endpoint
          #    This calls pg_catalog and guarantees a database hit
          http_code2=$(
            curl -sS -o /tmp/ka-response2 -w "%{http_code}" \
              -X POST "${SUPABASE_URL}/rest/v1/rpc/" \
              -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
              -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
              -H "Content-Type: application/json" \
              -d '{}' 2>/dev/null || echo "000"
          )
          echo "RPC endpoint response: $http_code2"

          # 3. Hit the auth endpoint — this also counts as project activity
          http_code3=$(
            curl -sS -o /tmp/ka-response3 -w "%{http_code}" \
              "${SUPABASE_URL}/auth/v1/settings" \
              -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}"
          )
          echo "Auth settings response: $http_code3"

          # Verify at least the primary request succeeded
          if [[ "$http_code" -ge 200 && "$http_code" -lt 300 ]]; then
            echo "✅ Keepalive successful — Supabase project is active."
          else
            echo "::error::Primary keepalive returned HTTP $http_code"
            echo "Response body:"
            cat /tmp/ka-response
            exit 1
          fi
