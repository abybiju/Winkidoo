# Build a signed release Android APK in the cloud for smoke-testing.
#
# This offloads the memory-heavy Gradle/JVM Android build to a free GitHub-hosted
# Linux runner so it never runs on a local machine. The resulting universal APK is
# attached to the workflow run as a downloadable artifact (Actions tab -> the run ->
# "Artifacts" -> winkidoo-smoke-test-apk). Share that .apk with testers directly.
#
# Cloud equivalent of build_apk.sh. Triggered manually from the Actions tab
# ("Run workflow"), so it never burns CI minutes on ordinary pushes.
#
# Required repo secrets (Settings -> Secrets and variables -> Actions):
#   SUPABASE_URL, SUPABASE_ANON_KEY, TAVILY_API_KEY,
#   REVENUECAT_API_KEY         -- the --dart-define values (from dart_defines.json)
#   (GEMINI_API_KEY is NOT needed here — Gemini is proxied server-side.)
#   ANDROID_KEYSTORE_BASE64    -- base64 of android/upload-keystore.jks
#   ANDROID_STORE_PASSWORD     -- storePassword from android/key.properties
#   ANDROID_KEY_PASSWORD       -- keyPassword from android/key.properties
#   GOOGLE_SERVICES_JSON_BASE64 -- base64 of android/app/google-services.json
name: Build smoke-test APK (Android release)

on:
  workflow_dispatch:
    inputs:
      release_notes:
        description: "Short note shown in the artifact name / for your own tracking"
        required: false
        default: "Winkidoo smoke test"

jobs:
  build-apk:
    name: Build signed release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter 3.41.2
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.2"
          channel: stable
          cache: true

      - name: Restore signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/upload-keystore.jks
          echo "Keystore restored: $(wc -c < android/upload-keystore.jks) bytes"

      - name: Write key.properties
        env:
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cat > android/key.properties <<EOF
          storePassword=$ANDROID_STORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=upload
          storeFile=../upload-keystore.jks
          EOF

      - name: Restore google-services.json
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > android/app/google-services.json

      - name: Write dart_defines.json
        env:
          # GEMINI_API_KEY is intentionally absent — Gemini is proxied server-side
          # via the gemini-proxy Edge Function, so the key never ships in the APK.
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          REVENUECAT_API_KEY: ${{ secrets.REVENUECAT_API_KEY }}
        run: |
          cat > dart_defines.json <<EOF
          {
            "SUPABASE_URL": "$SUPABASE_URL",
            "SUPABASE_ANON_KEY": "$SUPABASE_ANON_KEY",
            "TAVILY_API_KEY": "$TAVILY_API_KEY",
            "REVENUECAT_API_KEY": "$REVENUECAT_API_KEY"
          }
          EOF

      - name: flutter pub get
        run: flutter pub get

      - name: Build signed release APK
        run: flutter build apk --release --dart-define-from-file=dart_defines.json

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: winkidoo-smoke-test-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
