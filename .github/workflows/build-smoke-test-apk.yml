# Build a signed release Android APK in the cloud for smoke-testing.
#
# This offloads the memory-heavy Gradle/JVM Android build to a free GitHub-hosted
# Linux runner so it never runs on a local machine. The resulting universal APK is
# attached to the workflow run as a downloadable artifact (Actions tab -> the run ->
# "Artifacts" -> winkidoo-smoke-test-apk). Share that .apk with testers directly.
#
# Cloud equivalent of build_apk.sh. Triggered manually from the Actions tab
# ("Run workflow"), so it never burns CI minutes on ordinary pushes.
#
# Required repo secrets (Settings -> Secrets and variables -> Actions):
#   SUPABASE_URL, SUPABASE_ANON_KEY,
#   REVENUECAT_API_KEY         -- the --dart-define values (from dart_defines.json)
#   (GEMINI_API_KEY and TAVILY_API_KEY are NOT needed here — both are proxied
#    server-side via the gemini-proxy / tavily-proxy Edge Functions.)
#   ANDROID_KEYSTORE_BASE64    -- base64 of android/upload-keystore.jks
#   ANDROID_STORE_PASSWORD     -- storePassword from android/key.properties
#   ANDROID_KEY_PASSWORD       -- keyPassword from android/key.properties
#   GOOGLE_SERVICES_JSON_BASE64 -- base64 of android/app/google-services.json
#
# Optional secret (enables auto-distribution to testers):
#   FIREBASE_APP_DISTRIBUTION_SA -- JSON of a service account with the
#     "Firebase App Distribution Admin" role. If absent, the build still runs
#     and uploads the APK artifact; it just skips the Firebase upload.
name: Build smoke-test APK (Android release)

on:
  workflow_dispatch:
    inputs:
      release_notes:
        description: "Short note shown in the artifact name / for your own tracking"
        required: false
        default: "Winkidoo smoke test"

jobs:
  build-apk:
    name: Build signed release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Exposed as env so the Firebase step can be gated on its presence (secrets
    # can't be referenced directly in a step `if:`). Until this secret is added,
    # the build still runs and uploads the artifact — it just skips distribution.
    env:
      FIREBASE_SA: ${{ secrets.FIREBASE_APP_DISTRIBUTION_SA }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter 3.41.2
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.2"
          channel: stable
          cache: true

      - name: Restore signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/upload-keystore.jks
          echo "Keystore restored: $(wc -c < android/upload-keystore.jks) bytes"

      - name: Write key.properties
        env:
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cat > android/key.properties <<EOF
          storePassword=$ANDROID_STORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=upload
          storeFile=../upload-keystore.jks
          EOF

      - name: Restore google-services.json
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > android/app/google-services.json

      - name: Write dart_defines.json
        env:
          # GEMINI_API_KEY and TAVILY_API_KEY are intentionally absent — both are
          # proxied server-side (gemini-proxy / tavily-proxy Edge Functions), so
          # neither key ships in the APK.
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          REVENUECAT_API_KEY: ${{ secrets.REVENUECAT_API_KEY }}
        run: |
          cat > dart_defines.json <<EOF
          {
            "SUPABASE_URL": "$SUPABASE_URL",
            "SUPABASE_ANON_KEY": "$SUPABASE_ANON_KEY",
            "REVENUECAT_API_KEY": "$REVENUECAT_API_KEY"
          }
          EOF

      - name: flutter pub get
        run: flutter pub get

      - name: Build signed release APK
        # --build-number sets the Android versionCode to the (always-increasing)
        # run number, so each Firebase App Distribution release installs as an
        # update over the previous one on testers' devices.
        run: |
          flutter build apk --release \
            --dart-define-from-file=dart_defines.json \
            --build-number=${{ github.run_number }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: winkidoo-smoke-test-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

      # Auto-publishes the APK to Firebase App Distribution so testers get an
      # email + install link (and update notifications) without you sending the
      # file. Skipped until the FIREBASE_APP_DISTRIBUTION_SA secret is set.
      - name: Distribute to Firebase App Distribution
        if: ${{ env.FIREBASE_SA != '' }}
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: "1:356170729561:android:5cecd367b13b50faac4948"
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_APP_DISTRIBUTION_SA }}
          groups: testers
          file: build/app/outputs/flutter-apk/app-release.apk
          releaseNotes: ${{ inputs.release_notes }}
